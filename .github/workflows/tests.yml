name: Tests

# Runs the test suite and the offline dry run on every pull request (including
# the Builder's and Fixer's) and on pushes to main. Needs no secrets.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest

      - name: Dry run on sample data
        run: python -m factory.dry_run --out out/dry-run
