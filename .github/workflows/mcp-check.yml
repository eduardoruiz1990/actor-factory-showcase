name: MCP live check

# On demand: connect to the deployed MCP Actor as an AI agent would and call its tools. This is the
# only place the check can run, because APIFY_TOKEN lives only in GitHub Actions secrets. It starts a
# Standby run and charges one job to the owner's account.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Check
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m factory.watcher.mcp_check
